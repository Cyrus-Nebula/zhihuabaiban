<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>立体画板 · 智绘几何</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/site-improve.css" />
  <style>
    /* 3D AI 面板：自包含样式，刻意不改动共享的 css/style.css（避免与并行任务冲突） */
    .board3d-main { position: relative; }
    .b3d-ai-panel {
      position: absolute; right: 12px; top: 12px; bottom: 12px; width: 320px; z-index: 20;
      display: flex; flex-direction: column; min-height: 0;
      background: #fff; border: 1px solid #e3e6f0; border-radius: 14px;
      box-shadow: 0 14px 42px rgba(24, 26, 52, .18); overflow: hidden;
    }
    .b3d-ai-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #eceef6; }
    .b3d-ai-title { font-size: 14px; font-weight: 700; color: #3a3f57; }
    .b3d-ai-close { border: 0; background: none; cursor: pointer; color: #8b90a6; font-size: 15px; padding: 4px 8px; border-radius: 6px; }
    .b3d-ai-close:hover { background: #f2f3fa; color: #3a3f57; }
    .b3d-ai-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.6; }
    .b3d-ai-msg { padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
    .b3d-ai-msg.user { align-self: flex-end; max-width: 88%; background: #6549d5; color: #fff; }
    .b3d-ai-msg.ai { align-self: flex-start; max-width: 92%; background: #f2f3fa; color: #3a3f57; }
    .b3d-ai-msg.err { align-self: flex-start; max-width: 92%; background: #fff1f2; color: #be123c; }
    .b3d-ai-input-row { padding: 10px 12px; border-top: 1px solid #eceef6; display: flex; flex-direction: column; gap: 8px; }
    .b3d-ai-input-row textarea {
      width: 100%; box-sizing: border-box; resize: vertical; min-height: 56px; padding: 8px 10px;
      border: 1px solid #e0e3ee; border-radius: 9px; font-family: inherit; font-size: 13px;
      line-height: 1.5; color: #3a3f57; outline: none;
    }
    .b3d-ai-input-row textarea:focus { border-color: #6549d5; }
    .b3d-ai-input-row .btn { align-self: flex-end; }
    .b3d-ai-tip { padding: 0 12px 10px; font-size: 11px; line-height: 1.6; color: #9aa0b5; }
    @media (max-width: 720px) {
      .b3d-ai-panel { left: 12px; right: 12px; width: auto; top: 8px; bottom: 8px; }
    }
  </style>
</head>
<body class="board3d-page">
  <!-- 登录墙：未登录时覆盖整个画板页，登录后自动消失（见页脚网关脚本） -->
  <div class="login-wall" id="loginWall">
    <div class="login-wall-card">
      <a class="site-brand login-wall-brand" href="index.html">
        <img src="favicon.svg" alt="" width="28" height="28" />
        <span class="site-name">智绘几何</span>
      </a>
      <h2 class="login-wall-title">请登录后使用立体画板</h2>
      <p class="login-wall-sub">立体几何作图与云端同步需要登录账号。账号免费注册，密码以加盐哈希存储。</p>
      <button id="wallLogin" class="btn btn-primary" type="button">登录 / 注册</button>
    </div>
  </div>

  <header class="topbar board3d-topbar">
    <a class="btn ghost" href="index.html">← 返回</a>
    <input id="doc-name" class="doc-name" type="text" value="未命名立体画板" maxlength="50" />
    <span id="save-status" class="save-status">就绪</span>
    <span class="flex-spacer"></span>
    <div class="settings-wrap">
      <button id="btn-settings" class="btn" type="button" title="画板设置（坐标轴 / 网格 / 背景）">⚙ 设置</button>
      <div id="settings-pop" class="settings-pop hidden" role="dialog" aria-label="画板设置">
        <div class="settings-title">画板设置</div>
        <label class="settings-row" for="set-axis">
          <span>坐标轴</span>
          <input type="checkbox" id="set-axis" class="switch" />
        </label>
        <label class="settings-row" for="set-grid">
          <span>网格</span>
          <input type="checkbox" id="set-grid" class="switch" />
        </label>
        <div class="settings-row">
          <span>背景</span>
          <div class="seg-bg" id="set-bg">
            <button type="button" data-bg="white" class="bg-swatch bg-white" title="白色"></button>
            <button type="button" data-bg="beige" class="bg-swatch bg-beige" title="米色（护眼）"></button>
            <button type="button" data-bg="dark" class="bg-swatch bg-dark" title="深色"></button>
          </div>
        </div>
        <div class="settings-note">设置自动保存在本机浏览器</div>
      </div>
    </div>
    <button id="btn-ai3d" class="btn" type="button" title="用自然语言生成立体几何（AI 3D 命令集）">✦ AI 生成</button>
    <button id="btn-reset-view" class="btn" type="button" title="重置视角">⟳ 视角</button>
    <button id="btn-export" class="btn" type="button" title="导出工程文件（.json）">导出</button>
    <button id="btn-import" class="btn" type="button" title="导入工程文件（.json）">导入</button>
    <input id="import-file" type="file" accept=".json,application/json" style="display:none" />
  </header>

  <div class="board3d-main">
    <!-- 左侧：几何体面板 -->
    <aside class="b3d-palette" id="palette">
      <div class="b3d-palette-title">添加几何体</div>
      <button class="b3d-shape" data-shape="box" type="button">立方体</button>
      <button class="b3d-shape" data-shape="sphere" type="button">球体</button>
      <button class="b3d-shape" data-shape="cylinder" type="button">圆柱</button>
      <button class="b3d-shape" data-shape="cone" type="button">圆锥</button>
      <button class="b3d-shape" data-shape="pyramid" type="button">四棱锥</button>
      <button class="b3d-shape" data-shape="prism" type="button">三棱柱</button>
      <button class="b3d-shape" data-shape="tetra" type="button">正四面体</button>
      <button class="b3d-shape" data-shape="plane" type="button">平面</button>
      <button class="b3d-shape" data-shape="line" type="button">线段</button>
      <button class="b3d-shape" data-shape="point" type="button">点</button>
      <button class="b3d-shape" data-shape="label" type="button">标注</button>
      <div class="b3d-palette-tip">点击添加 · 拖拽旋转 · 滚轮缩放</div>
    </aside>

    <!-- 中央：3D 画布 -->
    <div class="b3d-stage" id="stage">
      <canvas id="b3d-canvas"></canvas>
      <div class="b3d-hint" id="b3dHint">点击左侧几何体添加到画布；空白处拖拽旋转视角，滚轮缩放</div>
      <div class="b3d-gizmo-modes" id="gizmoModes">
        <button data-mode="translate" class="active" type="button" title="移动">移动</button>
        <button data-mode="rotate" type="button" title="旋转">旋转</button>
        <button data-mode="scale" type="button" title="缩放">缩放</button>
      </div>
    </div>

    <!-- 右侧：属性面板 -->
    <aside class="b3d-inspector" id="inspector">
      <div class="b3d-inspector-empty" id="inspectorEmpty">
        <strong>未选中对象</strong>
        <span>点击画布中的几何体以查看 / 编辑属性</span>
      </div>
      <div id="inspectorBody" class="b3d-inspector-body hidden">
        <div class="b3d-insp-head">
          <span id="insp-type">几何体</span>
          <button id="insp-delete" class="btn btn-danger btn-sm" type="button">删除</button>
        </div>
        <div class="b3d-field b3d-text hidden" data-grp="text"><label>文字</label><input type="text" maxlength="40" data-k="text" placeholder="标注文字" /></div>
        <div class="b3d-field"><label>位置 X</label><input type="number" step="0.1" data-k="pos" data-i="0" /></div>
        <div class="b3d-field"><label>位置 Y</label><input type="number" step="0.1" data-k="pos" data-i="1" /></div>
        <div class="b3d-field"><label>位置 Z</label><input type="number" step="0.1" data-k="pos" data-i="2" /></div>
        <div class="b3d-field" data-grp="rot"><label>旋转 X°</label><input type="number" step="1" data-k="rot" data-i="0" /></div>
        <div class="b3d-field" data-grp="rot"><label>旋转 Y°</label><input type="number" step="1" data-k="rot" data-i="1" /></div>
        <div class="b3d-field" data-grp="rot"><label>旋转 Z°</label><input type="number" step="1" data-k="rot" data-i="2" /></div>
        <div class="b3d-field" data-grp="scale"><label>缩放 X</label><input type="number" step="0.1" min="0.05" data-k="scale" data-i="0" /></div>
        <div class="b3d-field" data-grp="scale"><label>缩放 Y</label><input type="number" step="0.1" min="0.05" data-k="scale" data-i="1" /></div>
        <div class="b3d-field" data-grp="scale"><label>缩放 Z</label><input type="number" step="0.1" min="0.05" data-k="scale" data-i="2" /></div>
        <div class="b3d-field b3d-color"><label>颜色</label><input type="color" data-k="color" /></div>
        <div class="b3d-field" data-grp="opacity"><label>透明度</label><input type="range" min="0.1" max="1" step="0.05" data-k="opacity" /></div>
        <div class="b3d-field-extra" id="inspExtra"></div>
      </div>
    </aside>

    <!-- 3D AI 作图面板：独立自主 3D 画板分支，与 2D 的 #aiPanel / js/executor.js 互不混用 -->
    <aside class="b3d-ai-panel hidden" id="b3dAiPanel" aria-label="立体画板 AI 助手">
      <div class="b3d-ai-head">
        <span class="b3d-ai-title">✦ 立体画板 AI</span>
        <button id="b3dAiClose" class="b3d-ai-close" type="button" title="收起面板" aria-label="收起面板">✕</button>
      </div>
      <div id="b3dAiLog" class="b3d-ai-log"></div>
      <div class="b3d-ai-input-row">
        <textarea id="b3dAiInput" rows="2" placeholder="用自然语言描述立体图形，如：画一个棱长 2 的正方体，标出顶点 A"></textarea>
        <button id="b3dAiSend" class="btn" type="button">生成</button>
      </div>
      <div class="b3d-ai-tip">3D 命令集：add3d / label3d / update3d / remove3d / clear3d / view3d / reset3d。AI 会读取当前场景对象，支持「把球放大」「删掉棱锥」这类对话式修改。</div>
    </aside>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- 登录墙网关：订阅 Auth 状态，未登录时显示全屏遮罩，登录后自动消失 -->
  <script>
    (function () {
      var wall = document.getElementById('loginWall');
      function sync() {
        if (!wall) return;
        if (window.Auth && window.Auth.user) wall.classList.add('hidden');
        else wall.classList.remove('hidden');
      }
      if (window.Auth) window.Auth.onChange(sync);
      document.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'wallLogin') { e.preventDefault(); if (window.Auth) window.Auth.openLogin(); }
      });
      sync();
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/models.js"></script>
  <script src="js/auth.js"></script>

  <!-- Three.js 已本地 vendor 至 libs/three/（r160）：断网或 CDN 不可用时 3D 画板仍可加载 -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/three.module.min.js",
      "three/addons/": "./libs/three/addons/"
    }
  }
  </script>
  <script type="module" src="js/board3d.js"></script>
  <!-- 3D AI 面板逻辑：import 同一个 board3d.js 模块实例，共享 board3dApi，不重复初始化 -->
  <script type="module" src="js/board3d-ai.js"></script>
  <script src="js/site-improve.js"></script>
</body>
</html>
