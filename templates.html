<main>
  <h1>资源库</h1>
  <p class="sub">内置模板与案例，点「使用模板」直接打开画板。</p>
  <div class="grid" id="tplGrid"></div>
  <p class="note" id="tplEmpty" hidden>模板清单没能加载，请刷新页面重试。</p>
</main>
<script src="/js/templates.js?v=blue1"></script>
<script src="/js/store.js?v=n1"></script>
<script>
(function () {
  var list = window.DAJIAO_TEMPLATES || [];
  var grid = document.getElementById('tplGrid');
  if (!list.length) { document.getElementById('tplEmpty').hidden = false; return; }
  list.forEach(function (t) {
    var card = document.createElement('div'); card.className = 'tpl';
    var thumb = document.createElement('div'); thumb.className = 'tpl-thumb'; thumb.innerHTML = t.thumb || '';
    var body = document.createElement('div'); body.className = 'tpl-body';
    var cat = document.createElement('span'); cat.className = 'tpl-cat'; cat.textContent = t.category || '';
    var h = document.createElement('h3'); h.className = 'tpl-title'; h.textContent = t.title || '';
    var p = document.createElement('p'); p.className = 'tpl-desc'; p.textContent = t.desc || '';
    var foot = document.createElement('div'); foot.className = 'tpl-foot';
    var author = document.createElement('span'); author.className = 'tpl-author'; author.textContent = t.author || '';
    var btn = document.createElement('button'); btn.className = 'btn btn-primary btn-sm'; btn.textContent = '使用模板';
    btn.addEventListener('click', function () {
      try {
        var f = Store.create(t.title, '2d');
        Store.saveContent(f.id, { name: t.title, commands: t.commands || [], moves: [] });
        location.href = '/board.html?id=' + encodeURIComponent(f.id);
      } catch (e) { alert('打开模板失败：' + (e && e.message ? e.message : e)); }
    });
    foot.append(author, btn); body.append(cat, h, p, foot); card.append(thumb, body); grid.appendChild(card);
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/config.js"></script>
<script src="/js/store.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/page-shell.js"></script>
