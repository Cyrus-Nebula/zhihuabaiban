<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>3D 画板浏览器冒烟自测</title>
  <!--
    无 GPU 环境的自测页：importmap 把 'three' 指向替身模块，
    该模块只替换 WebGLRenderer，其余仍是从 libs/three/ 加载的真实 Three.js。
    线上页面 board3d.html 完全不受影响（它用真实 WebGLRenderer）。
    打开方式：在仓库根起任意静态服务器后访问 /tests/board3d_browser_smoke.html
    也可用无头浏览器读取 window.__smoke / <pre id="result"> 里的 SMOKE_JSON。
  -->
  <script type="importmap">
  { "imports": { "three": "./three-webgl-stub.mjs" } }
  </script>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; color: #1f2937; }
    #host { width: 800px; height: 600px; border: 1px solid #e7ebf1; }
    #result { background: #f6f8fc; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: 13px; }
    .ok { color: #15803d; } .bad { color: #b91c1c; }
  </style>
</head>
<body>
  <h3>独立自主 3D 画板 · 浏览器冒烟自测</h3>
  <p>替身渲染器（无 GPU 可跑）；相机投影、射线拾取、OrbitControls、命令执行器均为真实实现。<br />
     对应 <code>docs/3D画板回归用例清单.md</code> 的视角(12) / 重置(13) / 拖拽联动(10、11) / 网格(15) / 坐标轴(14) / verify3d 自检(25)。</p>
  <div id="host"></div>
  <pre id="result">running…</pre>

  <script type="module">
    import { Board3D, createBoard3DExecutor } from '../js/board3d.js';
    import { DEMO_CUBE, DEMO_PYRAMID } from '../js/board3d-demos.js';

    const results = [];
    const near = (a, b, eps = 1e-3) => Math.abs(a - b) < eps;
    const vecNear = (v, arr, eps = 1e-3) =>
      !!v && near(v.x, arr[0], eps) && near(v.y, arr[1], eps) && near(v.z, arr[2], eps);
    function check(name, cond, extra) {
      results.push({ name, ok: !!cond, extra: extra == null ? '' : String(extra) });
    }

    const host = document.getElementById('host');
    const board = new Board3D(host);
    const exe = createBoard3DExecutor(board);

    // ---- 1. 构造 / 参考系 ----
    check('Board3D 构造成功且初始为空', board.entries.size === 0);
    check('默认等轴相机位置 (9,7,11)', vecNear(board.camera.position, [9, 7, 11]));
    check('XZ 网格地面已创建', board.scene.children.some((o) => o.type === 'GridHelper'));
    const axes = board.scene.children.find((o) => o.type === 'Group' && o.children.length > 30);
    check('坐标轴含箭头/刻度/数字/字母标签', !!axes, axes ? axes.children.length + ' 个对象' : '未找到');
    check('替身渲染器接管（无真实 WebGL 上下文）', board.renderer.getContext() === null);

    // ---- 2. 演示命令集（正方体 / 四棱锥）----
    const rCube = exe.execute(DEMO_CUBE);
    check('正方体演示命令全部成功', rCube.length === DEMO_CUBE.length && rCube.every((r) => r.ok), rCube.length + ' 条');
    check('正方体元素注册数 == 命令数', board.entries.size === DEMO_CUBE.length);
    const rPy = exe.execute([{ op: 'clear' }, ...DEMO_PYRAMID]);
    check('四棱锥演示命令全部成功', rPy.length === DEMO_PYRAMID.length + 1 && rPy.every((r) => r.ok));
    exe.execute([{ op: 'clear' }, ...DEMO_CUBE]);

    // ---- 2.5 声明式自检断言 verify3d（真实 Board3D，回归清单 25）----
    const vEdge = exe.execute([{ op: 'verify3d', id: 'vEdge', kind: 'distance', of: ['A', 'B'], expect: 3, tol: 0.05, label: '棱长 3' }])[0];
    check('verify3d 距离断言通过（棱长 3）', vEdge.ok && vEdge.value === 3 && vEdge.pass === true && vEdge.mode === 'abs');
    const vRight = exe.execute([{ op: 'verify3d', kind: 'angle', of: ['B', 'A', 'D'], expect: 90 }])[0];
    check('verify3d 直角断言通过（∠BAD = 90°）', vRight.ok && vRight.value === 90 && vRight.pass === true, 'tol=' + vRight.tol);
    const vDiag = exe.execute([{ op: 'verify3d', kind: 'distance', of: ['A', 'G'], expectRange: [5.19, 5.21], label: '体对角线≈3√3' }])[0];
    check('verify3d 区间容差通过（体对角线 3√3）', vDiag.ok && vDiag.pass === true && vDiag.mode === 'range', '实测 ' + vDiag.value);
    const vFail = exe.execute([{ op: 'verify3d', kind: 'distance', of: ['A', 'B'], expect: 4, tol: 0.01 }])[0];
    check('verify3d 期望不符判 ✘ 且给出偏差', vFail.ok && vFail.pass === false && Math.abs(vFail.delta + 1) < 1e-9);
    const vNoExpect = exe.execute([{ op: 'verify3d', kind: 'distance', of: ['A', 'B'] }])[0];
    check('verify3d 缺期望值安全判不通过', vNoExpect.ok && vNoExpect.mode === 'none' && vNoExpect.pass === false);
    const sizeBefore = board.entries.size;
    exe.execute([{ op: 'verify3d', kind: 'distance', of: ['A', 'GHOST'], expect: 3 }]);
    check('verify3d 引用不存在点不抛错、不新增图元', board.entries.size === sizeBefore);
    const vMeasure = exe.execute([{ op: 'measure3d', kind: 'distance', of: ['A', 'G'] }])[0];
    check('verify3d 与 measure3d 回读值一致（共用测量函数）', vMeasure.value === vDiag.value);

    // ---- 3. 视角预设 / 重置（回归清单 12 / 13）----
    const presets = { iso: [9, 7, 11], front: [0, 0, 14], top: [0, 14, 0], side: [14, 0, 0] };
    for (const [name, expect] of Object.entries(presets)) {
      board.viewPreset(name);
      check('视角预设 ' + name + ' → (' + expect.join(',') + ')', vecNear(board.camera.position, expect));
      check('视角预设 ' + name + ' 观察目标归零', vecNear(board.controls.target, [0, 0, 0]));
    }
    board.camera.position.set(1, 2, 3);
    board.controls.target.set(4, 5, 6);
    board.viewReset();
    check('重置视角恢复默认相机 (9,7,11)', vecNear(board.camera.position, [9, 7, 11]));
    check('重置视角恢复观察目标原点', vecNear(board.controls.target, [0, 0, 0]));

    // ---- 4. 拖拽拾取：屏幕射线反投影到工作面 + 依赖联动（10 / 11）----
    board.camera.updateMatrixWorld(true);
    const el = board.renderer.domElement;
    el.setPointerCapture = () => {};      // 无真实指针，屏蔽捕获
    el.releasePointerCapture = () => {};  // 同上，避免合成 pointerup 触发真实 DOM 异常
    const A = board.points.get('A');
    const proj = A.clone().project(board.camera);
    const sx = (proj.x + 1) / 2 * 800;
    const sy = (1 - proj.y) / 2 * 600;
    const send = (type, x, y) => el.dispatchEvent(new PointerEvent(type, {
      clientX: x, clientY: y, pointerId: 1, button: 0, buttons: 1, bubbles: true,
    }));
    send('pointerdown', sx, sy);
    check('按下时射线拾取到可拖拽点', !!board.dragging && board.dragging.userData.isPoint,
      board.dragging ? board.dragging.userData.id : 'null');
    const draggedId = board.dragging ? board.dragging.userData.id : null;
    if (draggedId) {
      const before = board.points.get(draggedId).clone();
      const edge = [...board.entries.values()].find((e) => e.type === 'segment3d' && e.deps.includes(draggedId));
      const edgeBefore = edge ? edge.obj.position.clone() : null;
      send('pointermove', sx + 90, sy + 40);
      const after = board.points.get(draggedId);
      check('拖拽后点坐标沿工作面改变', after.distanceTo(before) > 0.05, '位移 ' + after.distanceTo(before).toFixed(3));
      check('拖拽后 y 保持在原工作面高度', near(after.y, before.y));
      check('依赖该点的线段实时联动', !!edge && !!edgeBefore && edge.obj.position.distanceTo(edgeBefore) > 1e-6);
    }
    let changed = false;
    board.onChange = () => { changed = true; };
    send('pointerup', sx + 90, sy + 40);
    check('松开结束拖拽并触发 onChange', board.dragging === null && changed);

    // ---- 5. 测量 / 持久化（真实 THREE.Vector3 下）----
    exe.execute([
      { op: 'clear' },
      { op: 'point3d', id: 'A', x: 0, y: 0, z: 0 },
      { op: 'point3d', id: 'B', x: 3, y: 0, z: 0 },
      { op: 'point3d', id: 'C', x: 0, y: 4, z: 0 },
    ]);
    const dist = exe.execute([{ op: 'measure3d', kind: 'distance', of: ['A', 'B'] }])[0];
    const ang = exe.execute([{ op: 'measure3d', kind: 'angle', of: ['B', 'A', 'C'] }])[0];
    check('measure3d distance A-B == 3', dist.ok && dist.value === 3);
    check('measure3d angle ∠BAC == 90°', ang.ok && ang.value === 90);

    exe.execute([{ op: 'clear' }, { op: 'point3d', id: 'P', x: 1, y: 2, z: 3 }]);
    board.points.get('P').set(4, 5, 6);
    const mv = exe.moves();
    check('moves() 记录拖拽后坐标', mv.length === 1 && mv[0].x === 4 && mv[0].y === 5 && mv[0].z === 6);
    exe.execute([{ op: 'clear' }, { op: 'point3d', id: 'P', x: 1, y: 2, z: 3 }]);
    exe.applyMoves(mv);
    check('applyMoves() 还原坐标', board.points.get('P').x === 4 && board.points.get('P').z === 6);

    // ---- 6. 页面静态检查（board3d.html 的按钮与本地 vendor 引用）----
    const html = await fetch('/board3d.html').then((r) => r.text());
    check('board3d.html 经 importmap 引用本地 vendor Three.js',
      /"three"\s*:\s*"\.\/libs\/three\/three\.module\.min\.js"/.test(html));
    check('board3d.html 不含任何外部 CDN 引用',
      !/cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com/i.test(html));
    check('board3d.html 绑定 4 个视角预设按钮', (html.match(/data-view=/g) || []).length >= 4);
    check('board3d.html 绑定重置视角按钮且调用 viewReset()',
      /id="btnReset"/.test(html) && /viewReset\(\)/.test(html));
    check('board3d.html 内置 3D 命令执行器与 mode:3d AI 面板',
      /createBoard3DExecutor/.test(html) && /mode:\s*'3d'/.test(html));
    check('board3d.html AI 面板展示 verify3d ✔/✘ 自检摘要',
      /describeVerify3D/.test(html) && /verify-pass/.test(html) && /verify-fail/.test(html));
    check('board3d.html 把 measure3d / verify3d 纯读数排除出持久化命令',
      /currentCmds\.push\(cmd\)/.test(html) && /cmd\.op !== 'measure3d'/.test(html) && /cmd\.op !== 'verify3d'/.test(html));
    const promptJs = await fetch('/ai/board-prompt.js').then((r) => r.text());
    const backendJs = await fetch('/ai/board-backend.js').then((r) => r.text());
    check('AI 协议 3D 分支登记 verify3d 且后端拼接到 3D 提示词',
      /BOARD3D_VERIFY_ADDENDUM/.test(promptJs) && /verify3d/.test(promptJs)
      && /BOARD3D_SYSTEM_PROMPT \+ BOARD3D_VERIFY_ADDENDUM/.test(backendJs));

    // ---- 7. 渲染稳健性与工作面自适应（本轮增量）----
    exe.execute([
      { op: 'clear' },
      { op: 'point3d', id: 'P0', x: 0, y: 0, z: 0 },
      { op: 'point3d', id: 'P1', x: 2, y: 0, z: 0 },
      { op: 'point3d', id: 'P2', x: 2, y: 0, z: 2 },
      { op: 'point3d', id: 'P3', x: 0, y: 0, z: 2 },
      { op: 'polygon3d', id: 'F', points: ['P0', 'P1', 'P2', 'P3'] },
    ]);
    const face = board.entries.get('F');
    const geo = face.obj.geometry;
    check('多边形面半透明材质 depthWrite:false（缓解 z-fighting）', face.obj.material.depthWrite === false);
    check('多边形面生成时即计算包围球', !!geo.boundingSphere);
    const bs0 = geo.boundingSphere.clone();
    board.points.get('P0').set(20, 0, 20);
    board.notifyPointMoved('P0');
    const bs1 = geo.boundingSphere;
    check('拖拽顶点后包围球被重算（不再沿用旧球）',
      !bs1.center.equals(bs0.center) || bs1.radius !== bs0.radius,
      '旧 r=' + bs0.radius.toFixed(2) + ' 新 r=' + bs1.radius.toFixed(2));
    const farPt = board.points.get('P0');
    check('新包围球包含拖远后的顶点（面不会被视锥错误剔除）',
      farPt.distanceTo(bs1.center) <= bs1.radius + 1e-6,
      '距球心 ' + farPt.distanceTo(bs1.center).toFixed(2) + ' / 半径 ' + bs1.radius.toFixed(2));

    // 四视角下拖拽位移均合理：正视/侧视不再把顶点甩到 ±14 的相机位置
    function dragDistance(view) {
      exe.execute([{ op: 'clear' }, { op: 'point3d', id: 'Q', x: 0, y: 0, z: 0 }]);
      board.viewPreset(view);
      board.camera.updateMatrixWorld(true);
      board.scene.updateMatrixWorld(true);
      const el2 = board.renderer.domElement;
      el2.setPointerCapture = () => {};
      el2.releasePointerCapture = () => {};
      const q = board.points.get('Q');
      const pr = q.clone().project(board.camera);
      const x0 = (pr.x + 1) / 2 * 800, y0 = (1 - pr.y) / 2 * 600;
      const ev = (t, x, y) => el2.dispatchEvent(new PointerEvent(t, {
        clientX: x, clientY: y, pointerId: 2, button: 0, buttons: 1, bubbles: true,
      }));
      ev('pointerdown', x0, y0);
      const picked = !!board.dragging;
      const before = q.clone();
      ev('pointermove', x0 + 90, y0 + 40);
      const d = q.distanceTo(before);
      ev('pointerup', x0 + 90, y0 + 40);
      return { picked, d, horizontal: board.workPlaneHorizontal };
    }
    for (const [view, expectHoriz] of [['iso', true], ['top', true], ['front', false], ['side', false]]) {
      const r = dragDistance(view);
      check('视角 ' + view + ' 拖拽可拾取且位移合理（0.05 < d < 6）',
        r.picked && r.d > 0.05 && r.d < 6, '位移 ' + r.d.toFixed(2));
      check('视角 ' + view + ' 工作面为' + (expectHoriz ? '水平面' : '面向相机平面'),
        r.horizontal === expectHoriz);
    }
    board.viewReset();

    // ---- 8. resize / 外部请求 ----
    host.style.width = '1000px';
    host.style.height = '500px';
    board.resize();
    check('resize 更新相机宽高比', near(board.camera.aspect, 2));
    const external = performance.getEntriesByType('resource')
      .map((r) => r.name)
      .filter((n) => !n.startsWith(location.origin) && !n.startsWith('blob:') && !n.startsWith('data:'));
    check('运行期零外部网络请求（独立自主）', external.length === 0, external.join(', '));

    // ---- 汇总 ----
    const passed = results.filter((r) => r.ok).length;
    const failed = results.length - passed;
    const summary = { passed, failed, results };
    window.__smoke = summary;
    document.title = 'SMOKE_' + (failed ? 'FAIL' : 'OK');
    document.getElementById('result').textContent =
      `通过 ${passed}，失败 ${failed}\n\n` +
      results.map((r) => (r.ok ? '  ✓ ' : '  ✗ ') + r.name + (r.extra ? '  [' + r.extra + ']' : '')).join('\n') +
      '\n\nSMOKE_JSON:' + JSON.stringify(summary);
  </script>
</body>
</html>
