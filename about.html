  <h1>关于</h1>
  <div class="card about">
    <p>智绘几何是一个<strong>开源免费</strong>的在线动态几何画板：平面画板由开源引擎 <a href="https://jsxgraph.org" target="_blank" rel="noopener">JSXGraph</a> 驱动（本地加载，不依赖外网）；AI 作图经免费 LLM（智谱 GLM 普惠免费档）驱动，Key 只放在服务端；立体画板由 <a href="https://dajiaoai.com" target="_blank" rel="noopener">大角几何</a> 开放 SDK 提供。</p>
    <p>所有文件仅保存在你自己的浏览器 localStorage 中，不上传任何服务器；换浏览器或清理缓存会丢失，重要画板请及时「导出 JSON」。</p>
