<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画板编辑器</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css?v=blue1" />
</head>
<body>
  <div class="editor-layout">
    <div class="editor-topbar">
      <button class="back" id="btnBack">← 返回</button>
      <input id="docName" title="画板名称" />
      <select id="aiModel" class="ai-model-top" title="选择 AI 模型"></select>
      <div class="editor-status">
        <span id="saveStatus"><span class="dot"></span> 就绪</span>
        <span id="aiStatus" hidden><span class="dot busy"></span> AI 生成中…</span>
      </div>
    </div>
    <div id="editorHost">
      <div class="loading-mask" id="loadingMask">
        <div class="skel-board" aria-hidden="true">
          <div class="skel-canvas"></div>
          <div class="skel-row">
            <div class="skel-chip"></div>
            <div class="skel-chip"></div>
            <div class="skel-chip"></div>
          </div>
        </div>
        <p class="loading-text">正在加载画板引擎…</p>
      </div>
      <div class="error-mask" id="errorMask">
        <h3>画板加载失败</h3>
        <p id="errorText"></p>
        <p>这里是早期兼容版编辑器。作图请到<a href="/board.html">平面画板</a>或<a href="/board3d.html">立体画板</a>——两者都是本站自研、本地加载，无需任何外部配置。</p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/models.js"></script>
  <script type="module" src="js/editor.js"></script>
</body>
</html>
